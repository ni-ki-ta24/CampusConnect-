{% extends "base.html" %}

{% block title %}Add Placement - CampusConnect+{% endblock %}

{% block content %}
<div class="container py-5">
    <h1><i class="fas fa-plus-circle text-success"></i> Add Placement Opportunity</h1>
    <p class="text-muted">Add a new company placement opportunity.</p>

    <div class="row">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="company_name" class="form-label">Company Name *</label>
                            <input type="text" class="form-control" id="company_name" name="company_name" required>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description *</label>
                            <textarea class="form-control" id="description" name="description" rows="4" required></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="package" class="form-label">Package (CTC)</label>
                                <input type="text" class="form-control" id="package" name="package" placeholder="e.g., 6 LPA">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="location" class="form-label">Location</label>
                                <input type="text" class="form-control" id="location" name="location" placeholder="e.g., Pune, Mumbai">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="eligibility" class="form-label">Eligibility (Eligible Branches)</label>
                            <input type="text" class="form-control" id="eligibility" name="eligibility" placeholder="e.g., All branches, Computer/IT only">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="last_date" class="form-label">Last Date to Apply</label>
                                <input type="date" class="form-control" id="last_date" name="last_date">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="status" class="form-label">Status</label>
                                <select class="form-select" id="status" name="status">
                                    <option value="upcoming">Upcoming</option>
                                    <option value="ongoing">Ongoing</option>
                                    <option value="completed">Completed</option>
                                </select>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-save"></i> Add Placement
                            </button>
                            <a href="{{ url_for('placements') }}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
